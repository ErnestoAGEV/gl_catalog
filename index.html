<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G&L | Moda Masculina en Colima</title>
    <meta
      name="description"
      content="Descubre ropa y accesorios para hombre en G&L: camisas, polos, jeans y perfumes con estilo moderno."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.glboutique.com.mx/" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.glboutique.com.mx/" />
    <meta property="og:title" content="G&L | Moda Masculina en Colima" />
    <meta
      property="og:description"
      content="Moda masculina premium en Colima. Compra camisas, polos, jeans y perfumes en G&L."
    />
    <meta property="og:image" content="https://www.glboutique.com.mx/bannergl.webp" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="G&L" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  </head>
  <body class="bg-black overflow-x-hidden">
    <div id="app" class="overflow-x-hidden"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Register Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW registered:", reg.scope))
            .catch((err) => console.log("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
