<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G&L | Tu fit perfecto</title>
    <meta
      name="description"
      content="Descubre ropa y accesorios para hombre en G&L: camisas, polos, jeans y perfumes con estilo moderno."
    />
    <meta name="robots" content="index,follow" />
    <!-- canonical is set dynamically by seo.js per route — do NOT hardcode here -->

    <!-- Google Fonts — non-render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.glboutique.com.mx/" />
    <meta property="og:title" content="G&L | Tu fit perfecto" />
    <meta
      property="og:description"
      content="Moda masculina premium en Colima. Compra camisas, polos, jeans y perfumes en G&L."
    />
    <meta property="og:image" content="https://www.glboutique.com.mx/bannergl.webp" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="G&L" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

    <!-- Inline script: set canonical dynamically BEFORE app loads (for crawlers) -->
    <script>
      (function() {
        var path = window.location.pathname || '/';
        var base = 'https://www.glboutique.com.mx';
        var canonical = base + (path === '/' ? '/' : path.replace(/\/$/, ''));
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = canonical;
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body class="bg-black overflow-x-hidden">
    <div id="app" class="overflow-x-hidden"></div>

    <!-- Fallback content for search engines that don't execute JavaScript -->
    <noscript>
      <div style="background:#000;color:#fff;font-family:Inter,sans-serif;padding:40px 20px;text-align:center">
        <h1>G&L — Tu fit perfecto</h1>
        <p>Descubre ropa y accesorios para hombre: camisas, polos, jeans y perfumes con estilo moderno.</p>
        <nav style="margin-top:20px">
          <a href="/" style="color:#c8a97e;margin:0 12px">Inicio</a>
          <a href="/catalog" style="color:#c8a97e;margin:0 12px">Catálogo</a>
        </nav>
        <p style="margin-top:20px;font-size:14px;color:#999">Envío GRATIS en compras +$1,499 MXN · Colima, México</p>
        <p style="margin-top:10px;font-size:12px;color:#666">© 2026 G&L. Todos los derechos reservados.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Register Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW registered:", reg.scope))
            .catch((err) => console.log("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
